Organizations:
    - &OrdererOrg
        Name: OrdererOrg
        ID: OrdererMSP
        MSPDir: organizations/ordererOrganizations/com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('OrdererMSP.member')"
            Writers:
                Type: Signature
                Rule: "OR('OrdererMSP.member')"
            Admins:
                Type: Signature
                Rule: "OR('OrdererMSP.admin')"
        OrdererEndpoints:
            - orderer.com:7050

    - &HrOrg
        Name: HrMSP
        ID: HrMSP
        MSPDir: organizations/peerOrganizations/hr.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('HrMSP.admin', 'HrMSP.peer', 'HrMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('HrMSP.admin', 'HrMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('HrMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('HrMSP.peer')"

    - &BoardOrg
        Name: BoardMSP
        ID: BoardMSP
        MSPDir: organizations/peerOrganizations/board.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('BoardMSP.admin', 'BoardMSP.peer', 'BoardMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('BoardMSP.admin', 'BoardMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('BoardMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('BoardMSP.peer')"

Capabilities:
    Channel: &ChannelCapabilities
        V2_0: true
    Orderer: &OrdererCapabilities
        V2_0: true
    Application: &ApplicationCapabilities
        V2_5: true

Application: &ApplicationDefaults
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        LifecycleEndorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
        Endorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
    Capabilities:
        <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
    OrdererType: etcdraft
    Addresses:
        - orderer.com:7050
    EtcdRaft:
        Consenters:
        - Host: orderer.com
          Port: 7050
          ClientTLSCert: organizations/ordererOrganizations/com/orderers/orderer.com/tls/server.crt
          ServerTLSCert: organizations/ordererOrganizations/com/orderers/orderer.com/tls/server.crt
    BatchTimeout: 2s
    BatchSize:
        MaxMessageCount: 10
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        BlockValidation:
            Type: ImplicitMeta
            Rule: "ANY Writers"

Channel: &ChannelDefaults
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
    Capabilities:
        <<: *ChannelCapabilities

Profiles:
    TwoOrgsApplicationGenesis:
        <<: *ChannelDefaults
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *OrdererOrg
            Capabilities:
                <<: *OrdererCapabilities
        Consortiums:
            SampleConsortium:
                Organizations:
                    - *HrOrg
                    - *BoardOrg
    TwoOrgsChannel:
        Consortium: SampleConsortium
        <<: *ChannelDefaults
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *HrOrg
                - *BoardOrg
            Capabilities:
                <<: *ApplicationCapabilities
